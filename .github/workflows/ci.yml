# Every push and pull request builds the reactor and runs the unit tests; a push to main
# then publishes one image per service to GitHub Container Registry.
# See "Images and CI" in CLAUDE.md.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# a newer push to the same branch supersedes a run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/yiftach128

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run the unit tests
        run: mvn -B -ntp verify
      - name: Keep the test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

  images:
    name: Publish ${{ matrix.service }}
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - pollution-data-collector
          - pollution-data-writer
          - pollution-data-analyzer
          - pollution-alert-service
          - pollution-api-service
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          # sha-<short commit> for deployments, latest for convenience
          tags: |
            type=sha
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # no attestation manifests: they show up as untagged "unknown/unknown" entries in the registry
          provenance: false
